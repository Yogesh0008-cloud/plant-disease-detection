<!DOCTYPE html>
<html>
<head>
<title>Prediction Result</title>
<link rel="stylesheet"
href="{{url_for('static',filename='style.css')}}">
</head>

<body>

<div class="container">

<h1>🌱 Prediction Result</h1>

<img src="/uploads/{{image}}" width="250">

<h2>{{ disease }}</h2>

<h2>{{ display_disease }}</h2>

<h3>Confidence: {{ confidence }}%</h3>

<div style="
width:100%;
background:#444;
border-radius:10px;
height:25px;">

<div style="
width:{{ confidence }}%;
background:
{% if confidence > 90 %}
lime
{% elif confidence > 70 %}
orange
{% else %}
red
{% endif %};
height:25px;
border-radius:10px;">

</div>

</div>

<br>

<h2>Cause</h2>
<p>{{ cause }}</p>
<h2>Risk-Level</h2>
<p>{{risk}}</p>
<p>{{ treatment }}</p>
<h2>Description</h2>
<p>{{ description }}</p>
<h2>Predicton Time</h2>
<p>{{current_time}}</p>

<a href="{{ url_for('dashboard') }}">View Dashboard</a>
<br><br>
<a href="{{ url_for('report') }}">Download Report</a>
<br><br>
<a href="{{ url_for('home') }}">Check Another Leaf</a>
<br><br>
<a href="{{ url_for('logout') }}">Logout</a>

</div>

</body>
</html>
